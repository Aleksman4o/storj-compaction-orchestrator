name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - target: windows-amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test target
        shell: bash
        run: go test ./...
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          binary=storj-compaction-orchestrator
          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi
          ldflags="-s -w -X main.version=${VERSION}"
          tags="sqlite_omit_load_extension"
          if [[ "$GOOS" == "linux" ]]; then
            tags="osusergo netgo ${tags}"
            ldflags="${ldflags} -linkmode external -extldflags '-static'"
          fi
          go build -buildvcs=false -trimpath -tags "$tags" -ldflags "$ldflags" -o "dist/package/${binary}" .
          cp README.md "dist/package/README.md"
          if [[ "$GOOS" == "windows" ]]; then
            7z a "dist/storj-compaction-orchestrator-${VERSION}-${TARGET}.zip" ./dist/package/*
          else
            tar -C dist/package -czf "dist/storj-compaction-orchestrator-${VERSION}-${TARGET}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - name: Attest release assets
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Add attestation bundle to release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ github.ref_name }}
        run: cp "$BUNDLE_PATH" "dist/storj-compaction-orchestrator-${VERSION}-attestation.sigstore.json"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_NOTES: |
            ## Проверка подлинности

            Все файлы собраны GitHub Actions и имеют криптографически подписанную Sigstore build-provenance attestation.

            - [GitHub Attestation](${{ steps.attest.outputs.attestation-url }})
            - `storj-compaction-orchestrator-${{ github.ref_name }}-attestation.sigstore.json` — bundle для независимой проверки

            ```bash
            gh release verify ${{ github.ref_name }} -R Aleksman4o/storj-compaction-orchestrator
            gh release verify-asset ${{ github.ref_name }} <downloaded-file> -R Aleksman4o/storj-compaction-orchestrator
            ```
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == "false" ]]; then
              echo "Release $TAG is already published"
              exit 0
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "$RELEASE_NOTES"

  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest container image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/aleksman4o/storj-compaction-orchestrator
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
