name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - target: windows-amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test target
        shell: bash
        run: go test ./...
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          binary=storj-compaction-orchestrator
          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi
          ldflags="-s -w -X main.version=${VERSION}"
          tags="sqlite_omit_load_extension"
          if [[ "$GOOS" == "linux" ]]; then
            tags="osusergo netgo ${tags}"
            ldflags="${ldflags} -linkmode external -extldflags '-static'"
          fi
          go build -buildvcs=false -trimpath -tags "$tags" -ldflags "$ldflags" -o "dist/package/${binary}" .
          cp README.md "dist/package/README.md"
          if [[ "$GOOS" == "windows" ]]; then
            7z a "dist/storj-compaction-orchestrator-${VERSION}-${TARGET}.zip" ./dist/package/*
          else
            tar -C dist/package -czf "dist/storj-compaction-orchestrator-${VERSION}-${TARGET}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
